services:
  game:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
    init: true
    restart: unless-stopped
    volumes:
      - game-data:/app/data
    expose:
      - "3000"
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your game domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      game:
        condition: service_healthy
volumes:
  game-data:
  caddy-data:
  caddy-config:
